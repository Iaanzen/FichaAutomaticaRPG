<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Personagens - Forja da Criação</title>
  <link rel="icon" href="marca/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div id="barra-conta"></div>

  <!-- marca do app; trocar em marca/logo.svg (ver MARCA.md) -->
  <div class="marca-logo marca-logo-pequeno">
    <span class="so-leitor-de-tela">Forja da Criação</span>
  </div>

  <h1>Meus Personagens</h1>
  <a href="cadastro.html">Criar Novo Personagem</a>

  <!-- Etapa 3: aparece só se ainda houver fichas guardadas no navegador -->
  <div id="bloco-migracao" hidden>
    <p id="texto-migracao"></p>
    <button type="button" id="btn-migrar">Enviar para a minha conta</button>
    <button type="button" id="btn-dispensar-migracao">Agora não</button>
  </div>

  <!-- RF40: backup. O arquivo serve para guardar, para levar a outra conta
       e para duplicar um personagem. -->
  <div id="bloco-backup">
    <button type="button" id="btn-exportar-tudo">Exportar tudo</button>
    <button type="button" id="btn-importar">Importar de arquivo</button>
    <input type="file" id="arquivo-importar" accept="application/json,.json" hidden />
    <p id="status-backup"></p>
  </div>

  <ul id="lista-personagens"></ul>
  <p id="mensagem-vazio">Nenhum personagem cadastrado.</p>

  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="conteudo.js"></script>
  <script src="armazenamento.js"></script>
  <script src="index.js"></script>
</body>
</html>
